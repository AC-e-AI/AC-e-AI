name: Contribution card

on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the card (counts only, no repository names)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_stats.py --accounts AC-e-AI --out stats --label "AC-e-AI=Shipping every day"
      - name: Commit when something changed
        run: |
          git config user.name "Abhilash Chadhar"
          git config user.email "128818381+AC-e-AI@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Contribution card $(date -u +%F)"
          git push
